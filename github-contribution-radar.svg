<svg xmlns="http://www.w3.org/2000/svg" width="350" height="180" viewBox="0 0 350 180">
  <style>
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #8b949e;
      font-size: 11px;
    }
    .val-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #ffffff;
      font-size: 12px;
      font-weight: 600;
    }
    .axis {
      stroke: #39d353;
      stroke-width: 1.5;
      opacity: 0.55;
    }
    .poly {
      fill: rgba(0, 255, 157, 0.22);
      stroke: #00ff9d;
      stroke-width: 2;
    }
    .card-bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1;
      rx: 6px;
    }
  </style>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="0.5" y="0.5" width="349" height="179" class="card-bg" />

  <!-- Radar Grid/Axes -->
  <!-- Vertical Axis (Code review - Pull requests) -->
  <line x1="205" y1="35" x2="205" y2="145" class="axis" />
  <!-- Horizontal Axis (Commits - Issues) -->
  <line x1="150" y1="90" x2="260" y2="90" class="axis" />

  <!-- Data Polygon -->
  <polygon points="156.05,90 205,96.05 205,90 205,90" class="poly" />

  <!-- Data Points -->
  
    <circle cx="156.05" cy="90" r="3.5" fill="#ffffff" stroke="#00ff9d" stroke-width="2" filter="url(#glow)" />
  
    <circle cx="205" cy="96.05" r="3.5" fill="#ffffff" stroke="#00ff9d" stroke-width="2" filter="url(#glow)" />
  

  <!-- Labels & Values -->
  
  <!-- Top: Code review -->
  
    <text x="205" y="25" text-anchor="middle" class="label">Code review</text>
  

  <!-- Right: Issues -->
  
    <text x="270" y="94" text-anchor="start" class="label">Issues</text>
  

  <!-- Bottom: Pull requests -->
  
    <text x="205" y="161" text-anchor="middle" class="val-text">11%</text>
    <text x="205" y="173" text-anchor="middle" class="label">Pull requests</text>
  

  <!-- Left: Commits -->
  
    <text x="140" y="86" text-anchor="end" class="val-text">89%</text>
    <text x="140" y="98" text-anchor="end" class="label">Commits</text>
  

</svg>